name: Actualiser les offres et publier PRIX MALIN

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions: {}

concurrency:
  group: prix-malin-pages
  cancel-in-progress: false

jobs:
  eligibility:
    name: Vérifier le déclenchement de la publication
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Indiquer si la publication est autorisée
        id: check
        env:
          AUTO_REFRESH: ${{ vars.PRIX_MALIN_AUTO_REFRESH }}
        run: |
          publish=false
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            reason='Publication ignorée. Lancez le workflow sur la branche main.'
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            publish=true
            reason='Publication manuelle autorisée sur main, avec ou sans flux marchand.'
          elif [[ "$GITHUB_EVENT_NAME" == 'schedule' && "${AUTO_REFRESH,,}" == 'true' ]]; then
            publish=true
            reason='Actualisation planifiée autorisée sur main.'
          else
            reason='Actualisation planifiée désactivée. Définissez la variable de dépôt PRIX_MALIN_AUTO_REFRESH à true pour l’activer.'
          fi
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reason" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: eligibility
    if: github.ref == 'refs/heads/main' && needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: merchant-feeds
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier l’importeur
        run: python3 -m unittest scripts.test_build_offers scripts.test_import_awin
      - name: Récupérer les offres et générer le site
        env:
          MERCHANT_SOURCES_JSON: ${{ vars.MERCHANT_SOURCES_JSON }}
          AWIN_FNAC_FR_FEED_URL: ${{ secrets.AWIN_FNAC_FR_FEED_URL }}
          AWIN_FNAC_PRO_FR_FEED_URL: ${{ secrets.AWIN_FNAC_PRO_FR_FEED_URL }}
          AWIN_SAMSUNG_PRO_FR_FEED_URL: ${{ secrets.AWIN_SAMSUNG_PRO_FR_FEED_URL }}
          FNAC_FEED_URL: ${{ secrets.FNAC_FEED_URL }}
          FNAC_API_TOKEN: ${{ secrets.FNAC_API_TOKEN }}
          DARTY_FEED_URL: ${{ secrets.DARTY_FEED_URL }}
          DARTY_API_TOKEN: ${{ secrets.DARTY_API_TOKEN }}
          BOULANGER_FEED_URL: ${{ secrets.BOULANGER_FEED_URL }}
          BOULANGER_API_TOKEN: ${{ secrets.BOULANGER_API_TOKEN }}
          CDISCOUNT_FEED_URL: ${{ secrets.CDISCOUNT_FEED_URL }}
          CDISCOUNT_API_TOKEN: ${{ secrets.CDISCOUNT_API_TOKEN }}
        run: python3 scripts/build_offers.py --config-env MERCHANT_SOURCES_JSON --output "$RUNNER_TEMP/prix-malin-public"
      - name: Actualiser le catalogue BlazeVideo FR après autorisation
        if: vars.PRIX_MALIN_BLAZEVIDEO_PUBLISH == 'true'
        env:
          AWIN_BLAZEVIDEO_FR_FEED_URL: ${{ secrets.AWIN_BLAZEVIDEO_FR_FEED_URL }}
        run: python3 scripts/import_awin.py --download --mirror-images --output "$RUNNER_TEMP/prix-malin-public/awin/catalog.json"
      - name: Préparer le dossier public
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/prix-malin-public

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
